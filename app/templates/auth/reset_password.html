{% extends 'base.html' %}{% block title %}Choose new password — CareerHub{% endblock %}
{% block content %}<section class="form-wrap"><div class="panel"><p class="eyebrow">SECURE ACCOUNT</p><h1>Choose a new password</h1><p class="muted">Use a strong password you do not reuse elsewhere.</p><form method="post">{{form.hidden_tag()}}<label>{{form.password.label}}{{form.password(class='input',autocomplete='new-password')}}{% for e in form.password.errors %}<span class="field-error">{{e}}</span>{% endfor %}</label><label>{{form.confirm_password.label}}{{form.confirm_password(class='input',autocomplete='new-password')}}{% for e in form.confirm_password.errors %}<span class="field-error">{{e}}</span>{% endfor %}</label>{{form.submit(class='btn full')}}</form></div></section>{% endblock %}
