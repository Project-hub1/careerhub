{% extends 'base.html' %}{% block title %}Company Profile — CareerHub{% endblock %}{% block content %}<section class="section"><div class="form-wrap wide"><div class="panel"><p class="eyebrow">COMPANY PROFILE</p><h1>{% if company %}Edit company{% else %}Create company{% endif %}</h1><p class="muted">Candidates see this information on your company page.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="form-grid"><label>Company name<input class="input" name="name" value="{{company.name if company else ''}}" required></label><label>Industry<input class="input" name="industry" value="{{company.industry if company else 'Information Technology'}}" required></label><label>Location<input class="input" name="location" value="{{company.location if company else ''}}" required></label><label>Website<input class="input" name="website" value="{{company.website if company else ''}}" placeholder="https://example.com"></label></div><label>Description<textarea class="input" name="description" rows="8" placeholder="Tell candidates what your company does.">{{company.description if company else ''}}</textarea><button class="btn">Save company</button></form>{% if company %}<div class="notice success"><strong>Company is live.</strong><br><span class="muted">Saving your company profile approves it immediately, so you can publish jobs and have them appear on the homepage.</span></div><p class="muted">Approval status: <span class="status">{{company.approval_status}}</span></p>{% endif %}</div></div></section>{% endblock %}
