services:
  - type: web
    name: careerhub
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade && python seed.py
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile - run:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerhub-db
          property: connectionString
      - key: DEV_SHOW_RESET_LINK
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: JOBS_PER_PAGE
        value: "20"

databases:
  - name: careerhub-db
    databaseName: careerhub
    user: careerhub
